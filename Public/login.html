<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engine Tuning Shop | Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111827;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        h1 {
            text-align: center;
            color: #1f2937;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin: 15px 0 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-top: 18px;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .switch {
            text-align: center;
            margin-top: 20px;
            color: #4b5563;
        }

        .switch button {
            background: none;
            color: #2563eb;
            padding: 5px;
            margin-top: 5px;
        }

        .message {
            display: none;
            padding: 12px;
            border-radius: 6px;
            margin-top: 15px;
            overflow-wrap: anywhere;
        }

        .message.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .message.success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>Engine Tuning Shop</h1>
        <p class="subtitle" id="subtitle">Log in to manage customers</p>

        <form id="authForm">
            <div id="nameField" hidden>
                <label for="name">Full Name</label>
                <input id="name" name="name" autocomplete="name">
            </div>

            <label for="email">Email Address</label>
            <input
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                required
            >

            <label for="password">Password</label>
            <input
                id="password"
                name="password"
                type="password"
                minlength="8"
                autocomplete="current-password"
                required
            >

            <button type="submit" id="submitButton">Log In</button>
        </form>

        <div id="message" class="message" role="status" aria-live="polite"></div>

        <div class="switch">
            <span id="switchText">Don't have an account?</span>
            <button type="button" id="switchButton">Create Account</button>
        </div>
    </main>

    <script>
        const form = document.getElementById('authForm');
        const nameField = document.getElementById('nameField');
        const nameInput = document.getElementById('name');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const submitButton = document.getElementById('submitButton');
        const switchButton = document.getElementById('switchButton');
        const switchText = document.getElementById('switchText');
        const subtitle = document.getElementById('subtitle');
        const message = document.getElementById('message');

        let isRegistering = false;

        function showMessage(text, type) {
            message.textContent = text;
            message.className = `message ${type}`;
        }

        switchButton.addEventListener('click', () => {
            isRegistering = !isRegistering;

            nameField.hidden = !isRegistering;
            nameInput.required = isRegistering;

            submitButton.textContent = isRegistering
                ? 'Create Account'
                : 'Log In';

            switchText.textContent = isRegistering
                ? 'Already have an account?'
                : "Don't have an account?";

            switchButton.textContent = isRegistering
                ? 'Log In'
                : 'Create Account';

            subtitle.textContent = isRegistering
                ? 'Create an account to get started'
                : 'Log in to manage customers';

            passwordInput.autocomplete = isRegistering
                ? 'new-password'
                : 'current-password';

            message.className = 'message';
            message.textContent = '';
        });

        form.addEventListener('submit', async event => {
            event.preventDefault();

            const endpoint = isRegistering
                ? '/auth/register'
                : '/auth/login';

            const body = {
                email: emailInput.value.trim(),
                password: passwordInput.value
            };

            if (isRegistering) {
                body.name = nameInput.value.trim();
            }

            submitButton.disabled = true;

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(body)
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Request failed');
                }

                if (isRegistering) {
                    showMessage(
                        'Account created! You can now log in.',
                        'success'
                    );

                    isRegistering = false;
                    nameField.hidden = true;
                    nameInput.required = false;

                    submitButton.textContent = 'Log In';
                    switchText.textContent = "Don't have an account?";
                    switchButton.textContent = 'Create Account';
                    subtitle.textContent = 'Log in to manage customers';
                    passwordInput.value = '';
                    passwordInput.autocomplete = 'current-password';

                    return;
                }

                localStorage.setItem('token', data.token);

                showMessage('Login successful! Opening customers...', 'success');

                window.location.href = '/dashboard.html';
            } catch (error) {
                showMessage(error.message, 'error');
            } finally {
                submitButton.disabled = false;
            }
        });
    </script>
</body>
</html>
